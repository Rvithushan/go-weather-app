<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f7f6;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-width: 300px;
        }
        input[type="text"] {
            padding: 10px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Go Weather Checker</h1>

        <!-- Search Form -->
        <form action="/" method="GET">
            <input type="text" name="city" placeholder="Enter city name..." required>
            <button type="submit">Search</button>
        </form>

        {{if .Error}}
            <p class="error">{{.Error}}</p>
        {{else}}
            {{if .City}}
                <h2>Location: {{.City}}</h2>
                <h3>Temperature: {{.Temperature}} °C</h3>
                <h3>Wind Speed: {{.WindSpeed}} km/h</h3>
            {{end}}
        {{end}}
    </div>
</body>
</html>
